server:
  port: 8080
  servlet:
    context-path: /backend

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/reagent_management?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lab.reagent.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT配置
jwt:
  secret: reagent-management-secret-key-2024
  expiration: 86400000  # 24小时

# AI配置（使用豆包 Doubao 云端API）
ai:
  enabled: true
  base-url: https://ark.cn-beijing.volces.com/api/v3
  api-key: 67fed0c7-417d-4b0e-9401-253759e71478
  model: doubao-seed-1-6-flash-250828
